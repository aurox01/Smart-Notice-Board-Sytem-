<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Notice Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ Notice Board Admin Panel</h1>
            <p>Manage and publish company notices</p>
        </div>
        
        <div class="admin-container">
            <div class="form-container">
                <h2>📝 Create New Notice</h2>
                <form id="noticeForm">
                    <div class="form-group">
                        <label for="title">Title *</label>
                        <input type="text" id="title" name="title" required placeholder="Enter notice title">
                    </div>
                    
                    <div class="form-group">
                        <label for="content">Content *</label>
                        <textarea id="content" name="content" rows="4" required placeholder="Enter notice content"></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="author">Author *</label>
                            <input type="text" id="author" name="author" required placeholder="Your name">
                        </div>
                        
                        <div class="form-group">
                            <label for="department">Department</label>
                            <select id="department" name="department">
                                <option value="General">General</option>
                                <option value="HR">HR</option>
                                <option value="IT">IT</option>
                                <option value="Finance">Finance</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <select id="priority" name="priority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">📢 Publish Notice</button>
                    <button type="button" id="clearForm" class="btn btn-secondary">🗑️ Clear Form</button>
                </form>
            </div>
            
            <div class="notices-list">
                <h2>📋 Active Notices</h2>
                <button id="refreshNotices" class="btn btn-secondary">🔄 Refresh</button>
                <div id="adminNoticesContainer" class="admin-notices-grid">
                    <div class="loading">Loading notices...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="admin.js"></script>
</body>
</html>
